name: Screenshot UI smoke (light and dark)

on:
  pull_request:
    paths:
      - "src/main/java/com/m1racle/reader/pdfsplit/ui/**"
      - "src/main/java/com/m1racle/reader/pdfsplit/MainActivity.kt"
      - ".github/workflows/ui-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Build debug app
        run: bash ./gradlew assembleDebug --no-daemon --console=plain
      - name: Enable KVM device access
        shell: bash
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=70" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture real Compose screen in both appearances and large text
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            mkdir -p screenshots
            adb install -r build/outputs/apk/debug/*.apk
            adb shell cmd uimode night no
            adb shell am force-stop com.m1racle.reader.pdf || true
            adb shell am start -n com.m1racle.reader.pdf/com.m1racle.reader.pdfsplit.MainActivity
            sleep 5
            adb exec-out screencap -p > screenshots/01-light-empty.png
            adb shell cmd uimode night yes
            adb shell am force-stop com.m1racle.reader.pdf
            adb shell am start -n com.m1racle.reader.pdf/com.m1racle.reader.pdfsplit.MainActivity
            sleep 5
            adb exec-out screencap -p > screenshots/02-dark-empty.png
            adb shell cmd uimode night no
            adb shell settings put system font_scale 1.3
            adb shell am force-stop com.m1racle.reader.pdf
            adb shell am start -n com.m1racle.reader.pdf/com.m1racle.reader.pdfsplit.MainActivity
            sleep 5
            adb exec-out screencap -p > screenshots/03-light-130-font.png
            test -s screenshots/01-light-empty.png
            test -s screenshots/02-dark-empty.png
            test -s screenshots/03-light-130-font.png
      - name: Upload screenshots for independent UI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-split-light-dark-ui
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
