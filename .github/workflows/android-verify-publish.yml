name: PDF Split verify and publish

on:
  push:
    branches: [master, "fix/**", "ci/**"]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the Gradle version from master only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pdf-split-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install matching Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)
          [[ -x "$sdkmanager_bin" ]]
          compile_sdk=$(sed -nE 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' build.gradle.kts | head -n1)
          build_tools=$(sed -nE 's/^[[:space:]]*buildToolsVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.gradle.kts | head -n1)
          [[ -n "$compile_sdk" && -n "$build_tools" ]]
          "$sdkmanager_bin" "platforms;android-$compile_sdk" "build-tools;$build_tools"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          echo "BUILD_TOOLS_VERSION=$build_tools" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debuggable APK and lint
        run: bash ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon --console=plain
      - name: Bounded design models and negative controls (not Kotlin proofs)
        run: python3 tools/formal/verify_models.py
      - name: Six bounded TLA+ / TLC checks and negative-control mutations
        run: bash formal/pdf/verify_tlc.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Generate official pstack statecharts from checked TLA+ specs
        shell: bash
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools-pstack-1.7.4.jar
          JAVA: java
          PSTACK_REV: 6b0300214a09fd6029cfb7077043125758cd1fd2
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$TLA2TOOLS"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS" | sha256sum --check
          plugin="$RUNNER_TEMP/cursor-pstack"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/cursor/plugins.git "$plugin"
          git -C "$plugin" sparse-checkout set pstack/skills/statechart/scripts
          git -C "$plugin" fetch --quiet --depth 1 origin "$PSTACK_REV"
          git -C "$plugin" checkout --quiet "$PSTACK_REV"
          mkdir -p "$RUNNER_TEMP/pdf-statecharts"
          for model in PdfSourceSession PdfOutlineSelection PdfSplitCleanup PdfReleasePublication; do
            node "$plugin/pstack/skills/statechart/scripts/statechart.ts" \
              "$GITHUB_WORKSPACE/formal/pdf/specs/$model.tla" \
              --config "$GITHUB_WORKSPACE/formal/pdf/specs/$model.cfg" \
              --view "$GITHUB_WORKSPACE/formal/pdf/views/$model.ts" \
              --out "$RUNNER_TEMP/pdf-statecharts/$model"
            test -s "$RUNNER_TEMP/pdf-statecharts/$model/chart.mmd"
            test -s "$RUNNER_TEMP/pdf-statecharts/$model/report.md"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-formal-statecharts
          path: ${{ runner.temp }}/pdf-statecharts/
          if-no-files-found: error
          retention-days: 30
      - name: Validate local release script safety and mutation controls
        run: |
          bash -n scripts/release.sh
          python3 tools/formal/test_release_path.py
      - name: Publish lint artifacts for follow-up
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-split-lint
          path: build/reports/lint-results*
          if-no-files-found: ignore

  publish:
    name: Signed draft, remote verification, public Release
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/master' &&
        ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
         (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish]'))))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install matching Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)
          [[ -x "$sdkmanager_bin" ]]
          compile_sdk=$(sed -nE 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' build.gradle.kts | head -n1)
          build_tools=$(sed -nE 's/^[[:space:]]*buildToolsVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.gradle.kts | head -n1)
          [[ -n "$compile_sdk" && -n "$build_tools" ]]
          "$sdkmanager_bin" "platforms;android-$compile_sdk" "build-tools;$build_tools"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          echo "BUILD_TOOLS_VERSION=$build_tools" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify version, previous signed Release and immutable tag intent
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^val toolVersionName = "([^"]+)".*/\1/p' build.gradle.kts | head -n1)
          code=$(sed -nE 's/^val toolVersionCode = ([0-9]+).*/\1/p' build.gradle.kts | head -n1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$code" =~ ^[1-9][0-9]*$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || { echo "::error::Tag mismatch"; exit 1; }
            git fetch origin master
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::Tag not based on master"; exit 1; }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release already exists: $tag"; exit 1
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ -n "$previous" && "$previous" != "$tag" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - name: Require production signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.M1RACLE_RELEASE_STORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.M1RACLE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.M1RACLE_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.M1RACLE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
            echo "::error::Missing production signing secrets; no unsigned/debug-key fallback"; exit 1;
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pdf-release.jks"
          echo "M1RACLE_RELEASE_STORE_FILE=$RUNNER_TEMP/pdf-release.jks" >> "$GITHUB_ENV"
          echo "M1RACLE_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "M1RACLE_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "M1RACLE_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build production signed APK
        run: bash ./gradlew assembleRelease --no-daemon --console=plain
      - name: Verify signer continuity and version increase
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.meta.outputs.previous }}
          RELEASE_CODE: ${{ steps.meta.outputs.code }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$PREVIOUS_TAG" --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
          old_apks=("$RUNNER_TEMP"/previous/*.apk)
          [[ ${#old_apks[@]} == 1 && -f "${old_apks[0]}" ]] || {
            echo "::error::Expected exactly one previous signed APK"; exit 1;
          }
          new_apks=(build/outputs/apk/release/*.apk)
          [[ ${#new_apks[@]} == 1 && -f "${new_apks[0]}" ]]
          signer="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          aapt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          "$signer" verify "${old_apks[0]}"
          "$signer" verify "${new_apks[0]}"
          old_cert=$("$signer" verify --print-certs "${old_apks[0]}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          new_cert=$("$signer" verify --print-certs "${new_apks[0]}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          [[ -n "$old_cert" && "$old_cert" == "$new_cert" ]] || { echo "::error::Signing certificate changed"; exit 1; }
          old_code=$("$aapt" dump badging "${old_apks[0]}" | sed -nE "s/^package:.* versionCode='([0-9]+)'.*/\1/p" | head -n1)
          new_code=$("$aapt" dump badging "${new_apks[0]}" | sed -nE "s/^package:.* versionCode='([0-9]+)'.*/\1/p" | head -n1)
          [[ -n "$old_code" && "$new_code" == "$RELEASE_CODE" ]] && (( RELEASE_CODE > old_code )) || {
            echo "::error::versionCode must increase from previous signed APK"; exit 1;
          }
          cp "${new_apks[0]}" m1racle-pdf-split-release.apk
          sha256sum m1racle-pdf-split-release.apk > m1racle-pdf-split-release.apk.sha256
          sha256sum --check m1racle-pdf-split-release.apk.sha256
      - name: Upload draft; verify downloaded APK, checksum and signer; then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          apk=m1racle-pdf-split-release.apk
          gh release create "$RELEASE_TAG" "$apk" "$apk.sha256" --draft \
            --target "$GITHUB_SHA" --title "M1racle PDF Split $RELEASE_TAG" \
            --notes "Release passed Gradle tests, signed build, signer continuity and remote asset read-back."
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download "$RELEASE_TAG" --pattern "$apk" --dir "$RUNNER_TEMP/readback"
          gh release download "$RELEASE_TAG" --pattern "$apk.sha256" --dir "$RUNNER_TEMP/readback"
          cmp "$apk" "$RUNNER_TEMP/readback/$apk"
          cmp "$apk.sha256" "$RUNNER_TEMP/readback/$apk.sha256"
          (cd "$RUNNER_TEMP/readback" && sha256sum --check "$apk.sha256")
          signer="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$signer" verify "$RUNNER_TEMP/readback/$apk"
          expected=$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          actual=$("$signer" verify --print-certs "$RUNNER_TEMP/readback/$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          [[ -n "$expected" && "$expected" == "$actual" ]]
          [[ "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" == "2" ]]
          gh release edit "$RELEASE_TAG" --draft=false
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == "false" ]]
          echo "Published $RELEASE_TAG after remote read-back verification"
